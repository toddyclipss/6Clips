<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
        width: 1080px;
        height: 1920px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      [data-composition-id="tiktok-follow"] .lower-third {
        position: absolute;
        bottom: 160px;
        left: 50%;
        transform: translateX(-50%);
        width: 920px;
        background: rgba(18, 18, 18, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 28px;
        padding: 24px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transform: translate(-50%, 300px);
        animation: ttCardTimeline 4.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes ttCardTimeline {
        0% {
          opacity: 0;
          transform: translate(-50%, 300px);
        }
        8% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        88% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, 300px);
        }
      }

      [data-composition-id="tiktok-follow"] .profile {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      [data-composition-id="tiktok-follow"] .avatar-wrapper {
        position: relative;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        padding: 3px;
        background: linear-gradient(135deg, #25f4ee 0%, #fe2c55 100%);
      }

      [data-composition-id="tiktok-follow"] .avatar {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #121212;
      }

      [data-composition-id="tiktok-follow"] .info {
        display: flex;
        flex-direction: column;
      }

      [data-composition-id="tiktok-follow"] .handle-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      [data-composition-id="tiktok-follow"] .handle {
        color: #ffffff;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: -0.5px;
      }

      [data-composition-id="tiktok-follow"] .verified {
        width: 24px;
        height: 24px;
        fill: #20d5ec;
      }

      [data-composition-id="tiktok-follow"] .subtitle {
        color: #a8a8a8;
        font-size: 22px;
        margin-top: 4px;
        font-weight: 400;
      }

      [data-composition-id="tiktok-follow"] .follow-btn {
        background: #fe2c55;
        color: #ffffff;
        border: none;
        border-radius: 16px;
        padding: 16px 36px;
        font-size: 24px;
        font-weight: 700;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        animation: ttButtonPress 4.2s ease forwards;
      }

      @keyframes ttButtonPress {
        0%, 24% {
          transform: scale(1);
          background: #fe2c55;
        }
        27% {
          transform: scale(0.92);
          background: #fe2c55;
        }
        31% {
          transform: scale(1);
          background: #2f2f2f;
        }
        100% {
          transform: scale(1);
          background: #2f2f2f;
        }
      }

      [data-composition-id="tiktok-follow"] .btn-text-follow {
        animation: ttFollowText 4.2s ease forwards;
      }

      [data-composition-id="tiktok-follow"] .btn-text-following {
        display: none;
        animation: ttFollowingText 4.2s ease forwards;
      }

      @keyframes ttFollowText {
        0%, 27% { display: inline; opacity: 1; }
        28%, 100% { display: none; opacity: 0; }
      }

      @keyframes ttFollowingText {
        0%, 27% { display: none; opacity: 0; }
        28%, 100% { display: inline; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div data-composition-id="tiktok-follow">
      <div class="lower-third" id="tt-card">
        <div class="profile">
          <div class="avatar-wrapper">
            <img class="avatar" src="assets/avatar.jpg" alt="Profile" />
          </div>
          <div class="info">
            <div class="handle-row">
              <span class="handle">@6clips</span>
              <svg class="verified" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
            </div>
            <span class="subtitle">Follow on TikTok</span>
          </div>
        </div>
        <button class="follow-btn" id="follow-btn">
          <span class="btn-text-follow" id="btn-follow">Follow</span>
          <span class="btn-text-following" id="btn-following">Following</span>
        </button>
      </div>
    </div>
    <script>
      // Native timeline adapter for preview scrubber compatibility
      window.__timelines = window.__timelines || {};
      window.__timelines["tiktok-follow"] = {
        duration: function() { return 4.2; },
        seek: function(t) {
          var el = document.getElementById("tt-card");
          if (!el) return;
          var progress = Math.max(0, Math.min(1, t / 4.2));
          el.style.animationPlayState = "paused";
          el.style.animationDelay = (-progress * 4.2) + "s";
        },
        play: function() {
          var el = document.getElementById("tt-card");
          if (el) el.style.animationPlayState = "running";
        },
        pause: function() {
          var el = document.getElementById("tt-card");
          if (el) el.style.animationPlayState = "paused";
        }
      };
    </script>
  </body>
</html>
