<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      [data-composition-id="frost"] canvas[data-shader] {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      data-composition-id="frost"
      data-start="0"
      data-duration="2"
      data-width="1920"
      data-height="1080"
      data-requires-webgpu
      data-no-timeline
      style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000"
    >
      <canvas data-shader="Frost" width="1920" height="1080"></canvas>
    </div>
    <script src="lib/shaders.iife.js"></script>
    <script src="lib/shader_fallback.js"></script>
  
    <script>
      (function() {
        window.__timelines = window.__timelines || {};
        var shaderTl = {
          currentTime: 0,
          duration: function() { return 10.0; },
          seek: function(t) {
            this.currentTime = Number(t) || 0;
            window.__shaderTime = this.currentTime;
            var existing = (window.__timelines && window.__timelines['frost'] && window.__timelines['frost'] !== shaderTl) ? window.__timelines['frost'] : null;
            if (existing && typeof existing.seek === 'function') {
              existing.seek(this.currentTime);
            }
            window.dispatchEvent(new CustomEvent('hf-seek', { detail: { time: this.currentTime } }));
          },
          play: function() {
            var self = this;
            if (self._raf) cancelAnimationFrame(self._raf);
            var start = performance.now() - (self.currentTime * 1000);
            function loop() {
              var elapsed = (performance.now() - start) / 1000;
              self.seek(elapsed % self.duration());
              self._raf = requestAnimationFrame(loop);
            }
            self._raf = requestAnimationFrame(loop);
          },
          pause: function() {
            if (this._raf) cancelAnimationFrame(this._raf);
          }
        };
        window.__timelines['frost'] = shaderTl;
        if (!window.tl) window.tl = shaderTl;
        shaderTl.play();
      })();
    </script>
        
  </body>
</html>
