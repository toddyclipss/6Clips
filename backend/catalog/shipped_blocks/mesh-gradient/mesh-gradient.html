<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      [data-composition-id="mesh-gradient"] canvas[data-shader] {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      data-composition-id="mesh-gradient"
      data-start="0"
      data-duration="2"
      data-width="1920"
      data-height="1080"
      data-requires-webgpu
      data-no-timeline
      style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000"
    >
      <canvas data-shader="MeshGradient" width="1920" height="1080"></canvas>
    </div>
    <script src="lib/shaders.iife.js"></script>
    <script src="lib/shader_fallback.js"></script>
  
    <script>
      (function() {
        window.__timelines = window.__timelines || {};
        var shaderTl = {
          currentTime: 0,
          duration: function() { return 10.0; },
          seek: function(t) {
            this.currentTime = Number(t) || 0;
            window.__shaderTime = this.currentTime;
            window.dispatchEvent(new CustomEvent('hf-seek', { detail: { time: this.currentTime } }));
          },
          play: function() {},
          pause: function() {}
        };
        window.__timelines['mesh-gradient'] = shaderTl;
        if (!window.tl) window.tl = shaderTl;
      })();
    </script>
        
  </body>
</html>
