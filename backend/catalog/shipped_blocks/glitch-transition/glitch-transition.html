<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .glitch-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        overflow: hidden;
      }

      .glitch-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .scanlines {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0, 0, 0, 0.4) 50%,
          rgba(0, 0, 0, 0.4)
        );
        background-size: 100% 4px;
        pointer-events: none;
        opacity: 0.7;
      }

      .glitch-content {
        position: relative;
        z-index: 2;
        text-align: center;
        color: #ffffff;
        animation: glitchText 1.5s steps(2, start) infinite;
      }

      .glitch-badge {
        display: inline-block;
        padding: 6px 16px;
        background: rgba(0, 240, 255, 0.2);
        border: 1px solid #00f0ff;
        color: #00f0ff;
        border-radius: 4px;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .glitch-title {
        font-size: 56px;
        font-weight: 900;
        letter-spacing: -0.02em;
        text-shadow: 2px 2px 0px #ff0055, -2px -2px 0px #00f0ff;
      }

      @keyframes glitchText {
        0% { transform: translate(0); text-shadow: 2px 2px #ff0055, -2px -2px #00f0ff; }
        20% { transform: translate(-3px, 2px); text-shadow: -3px -1px #ff0055, 2px 1px #00f0ff; }
        40% { transform: translate(2px, -1px); text-shadow: 3px 2px #ff0055, -1px -2px #00f0ff; }
        60% { transform: translate(-1px, -2px); text-shadow: -2px 1px #ff0055, 1px -1px #00f0ff; }
        80% { transform: translate(3px, 1px); text-shadow: 1px -2px #ff0055, -3px 2px #00f0ff; }
        100% { transform: translate(0); text-shadow: 2px 2px #ff0055, -2px -2px #00f0ff; }
      }
    </style>
  </head>
  <body>
    <div class="glitch-wrapper" id="glitch-container">
      <canvas class="glitch-canvas" id="canvas"></canvas>
      <div class="scanlines"></div>
      <div class="glitch-content">
        <div class="glitch-badge">TRANSITION // WIPING</div>
        <h1 class="glitch-title">SCENE CUT</h1>
      </div>
    </div>
    <script>
      (function() {
        var canvas = document.getElementById("canvas");
        var ctx = canvas.getContext("2d");
        var width, height;

        function resize() {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        var frame = 0;
        function render() {
          ctx.clearRect(0, 0, width, height);
          frame++;
          if (frame % 3 === 0) {
            // Horizontal RGB slice displacement
            var slices = 8;
            for (var i = 0; i < slices; i++) {
              var y = Math.random() * height;
              var h = Math.random() * 24 + 4;
              var offset = (Math.random() - 0.5) * 40;
              ctx.fillStyle = Math.random() > 0.5 ? "rgba(255, 0, 85, 0.3)" : "rgba(0, 240, 255, 0.3)";
              ctx.fillRect(offset, y, width, h);
            }
          }
          requestAnimationFrame(render);
        }
        render();

        window.__timelines = window.__timelines || {};
        window.__timelines["glitch-transition"] = {
          duration: function() { return 1.5; },
          seek: function(t) {},
          play: function() {},
          pause: function() {}
        };
      })();
    </script>
  </body>
</html>
