<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
        width: 1920px;
        height: 1080px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      [data-composition-id="yt-lower-third"] .lower-third {
        position: absolute;
        bottom: 80px;
        left: 80px;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-left: 6px solid #ff0000;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 12px;
        padding: 20px 32px;
        display: flex;
        align-items: center;
        gap: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        opacity: 0;
        transform: translateY(80px);
        animation: ytCardTimeline 5.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes ytCardTimeline {
        0% {
          opacity: 0;
          transform: translateY(80px);
        }
        8% {
          opacity: 1;
          transform: translateY(0);
        }
        88% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(80px);
        }
      }

      [data-composition-id="yt-lower-third"] .avatar-wrapper {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.2);
        flex-shrink: 0;
      }

      [data-composition-id="yt-lower-third"] .avatar {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      [data-composition-id="yt-lower-third"] .content {
        display: flex;
        flex-direction: column;
      }

      [data-composition-id="yt-lower-third"] .title {
        color: #ffffff;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.3px;
        line-height: 1.2;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      }

      [data-composition-id="yt-lower-third"] .subtitle {
        color: #e2e8f0;
        font-size: 18px;
        font-weight: 500;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div data-composition-id="yt-lower-third">
      <div class="lower-third lower-third-container" id="yt-card">
        <div class="avatar-wrapper">
          <img class="avatar" src="assets/avatar.jpg" alt="Channel Avatar" />
        </div>
        <div class="content">
          <span class="title lower-third-title">@6clips · Subscribe</span>
          <span class="subtitle lower-third-subtitle">Daily Motion Graphics & AI Video Tools</span>
        </div>
      </div>
    </div>
    <script>
      // Native timeline adapter for preview scrubber compatibility
      window.__timelines = window.__timelines || {};
      window.__timelines["yt-lower-third"] = {
        duration: function() { return 5.0; },
        seek: function(t) {
          var el = document.getElementById("yt-card");
          if (!el) return;
          var progress = Math.max(0, Math.min(1, t / 5.0));
          el.style.animationPlayState = "paused";
          el.style.animationDelay = (-progress * 5.0) + "s";
        },
        play: function() {
          var el = document.getElementById("yt-card");
          if (el) el.style.animationPlayState = "running";
        },
        pause: function() {
          var el = document.getElementById("yt-card");
          if (el) el.style.animationPlayState = "paused";
        }
      };
    </script>
  </body>
</html>
